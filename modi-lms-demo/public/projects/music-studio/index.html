<!doctype html>
<html lang="ko"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop Studio · MODI+</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
  <header><div><p>MODI+ MUSIC LAB</p><h1>Loop Studio</h1><span>Dial 또는 Joystick으로 볼륨을, Button으로 재생을 조절하세요</span></div><button id="play" aria-label="재생"><i></i><b>PLAY</b></button></header>
  <section class="transport"><div><small>TEMPO</small><label><strong id="tempo-value">110</strong><em>BPM</em><input id="tempo" type="range" min="60" max="180" value="110"></label></div><div><small>VOLUME · DIAL / JOYSTICK</small><label><strong id="volume-value">65</strong><em>%</em><input id="volume" type="range" min="0" max="100" value="65"></label></div><span id="status">● 연결 중</span></section>
  <section class="machine"><div id="visualizer" class="visualizer" aria-hidden="true"></div><div id="sequencer" class="sequencer" aria-label="8 step music sequencer"></div></section>
  <footer><button id="clear">Clear pattern</button><button id="test-speaker">Test Speaker</button><p>실제 모드는 MODI+ Speaker로만, Mock 모드는 컴퓨터에서 재생됩니다.</p></footer>
</main><script src="browser-api.js"></script><script src="app.js"></script></body></html>
