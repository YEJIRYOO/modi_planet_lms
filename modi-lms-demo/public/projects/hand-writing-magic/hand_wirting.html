<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>손가락 마법 그림판</title>
  <style>
    :root{--ink:#17202b;--paper:#fffaf1;--blue:#3a86ff;--pink:#ff5c9a;--yellow:#ffd84d;--mint:#5ee1b2;--violet:#9c72ff;--glass:#ffffffdb}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111827;color:var(--ink)}video{display:none}.camera{position:fixed;inset:0;background:radial-gradient(circle at center,#273449,#111827)}canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 25%,#07101d55 100%)}.topbar{position:fixed;z-index:5;left:20px;right:20px;top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:15px;pointer-events:none}.brand,.status,.mission,.tools,.palette{pointer-events:auto;background:var(--glass);border:1px solid #fff;border-radius:22px;box-shadow:0 18px 50px #07101d35;backdrop-filter:blur(18px)}.brand{padding:15px 18px}.brand small{display:block;color:var(--blue);font-size:9px;font-weight:900;letter-spacing:.17em}.brand h1{font-size:clamp(21px,4vw,34px);letter-spacing:-.045em;margin:3px 0}.brand p{margin:0;color:#687484;font-size:12px}.status{padding:11px 15px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800}.status i{width:10px;height:10px;border-radius:50%;background:#aab1b9}.status[data-state=ready] i{background:var(--mint);box-shadow:0 0 14px var(--mint)}.status[data-state=draw] i{background:var(--pink);box-shadow:0 0 14px var(--pink)}.sidebar{position:fixed;z-index:5;left:20px;top:148px;bottom:110px;width:230px;display:grid;align-content:start;gap:12px}.mission{padding:17px}.mission-label{color:var(--violet);font-size:9px;font-weight:900;letter-spacing:.16em}.mission-emoji{display:block;font-size:47px;margin:8px 0}.mission h2{font-size:20px;margin:0 0 6px}.mission p{font-size:12px;line-height:1.45;color:#6b7684;margin:0 0 13px}.mission button{width:100%;border:0;border-radius:13px;padding:10px;background:#eee9ff;color:#6444ad;font-weight:850;cursor:pointer}.stars{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #e7e3dc}.stars b{font-size:21px}.stars span{font-size:11px;color:#78818c}.tools{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{border:0;border-radius:12px;padding:10px 7px;background:#f1f3f5;color:#34404e;font-weight:800;font-size:11px;cursor:pointer}.tools .finish{grid-column:1/-1;background:var(--yellow);color:#5a4600}.bottom{position:fixed;z-index:5;left:270px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}.palette{display:flex;align-items:center;gap:8px;padding:10px 12px}.color{width:36px;height:36px;border:3px solid white;border-radius:50%;background:var(--c);box-shadow:0 3px 8px #0002;cursor:pointer}.color.selected{outline:3px solid var(--ink);outline-offset:2px}.color.rainbow{background:conic-gradient(#ff4d62,#ffca3a,#4edb9d,#3a86ff,#a66cff,#ff4d62)}.size{height:36px;min-width:42px;border:0;border-radius:12px;background:#eef1f4;font-weight:900;cursor:pointer}.size.selected{background:var(--ink);color:white}.helper{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:white;pointer-events:none;text-shadow:0 3px 18px #000}.helper .hand{font-size:72px;display:block;animation:float 1.5s ease-in-out infinite alternate}.helper strong{display:block;font-size:22px}.helper p{margin:6px;color:#dbe4ef}.helper.hidden{display:none}.start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 35%,#3758a4,#101828 68%);color:white}.start-card{width:min(530px,100%);text-align:center;padding:35px;border:1px solid #ffffff28;border-radius:30px;background:#ffffff10;box-shadow:0 35px 90px #0005;backdrop-filter:blur(15px)}.start .mascot{font-size:76px}.start h2{font-size:clamp(30px,7vw,52px);letter-spacing:-.05em;margin:10px}.start p{color:#cad7e9;line-height:1.6}.start button{border:0;border-radius:99px;padding:14px 24px;background:var(--yellow);color:#493900;font:900 16px system-ui;cursor:pointer;box-shadow:0 13px 30px #ffd84d35}.start .privacy{display:block;margin-top:15px;font-size:10px;color:#92a1b6}.toast{position:fixed;z-index:15;left:50%;top:22%;transform:translate(-50%,-10px);padding:13px 20px;border-radius:99px;background:#17202be8;color:white;font-weight:850;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.confetti{position:fixed;z-index:14;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:11px;height:18px;left:var(--x);top:-25px;background:var(--c);animation:fall 1.4s ease-in forwards;transform:rotate(var(--r))}@keyframes fall{to{top:105%;transform:rotate(720deg)}}@keyframes float{to{transform:translateY(-12px) rotate(5deg)}}@media(max-width:760px){.topbar{left:10px;right:10px}.brand p{display:none}.sidebar{left:10px;top:auto;bottom:92px;width:185px}.mission{padding:12px}.mission p,.mission-emoji{display:none}.tools{display:none}.bottom{left:10px;right:10px;bottom:10px;justify-content:flex-end}.palette{max-width:100%;overflow-x:auto}.color{width:31px;height:31px;flex:0 0 auto}.helper strong{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="camera"><video id="video" playsinline></video><canvas id="canvas"></canvas><div class="shade"></div></div>
  <div class="topbar"><div class="brand"><small>MEDIAPIPE MAGIC LAB</small><h1>손가락 마법 그림판</h1><p>엄지와 검지를 붙여서 하늘에 그림을 그려요</p></div><div id="status" class="status"><i></i><span>카메라 준비 중</span></div></div>
  <aside class="sidebar"><section class="mission"><span class="mission-label">TODAY'S MISSION</span><span id="mission-emoji" class="mission-emoji">⭐</span><h2 id="mission-title">반짝이는 별</h2><p id="mission-text">공중에 커다란 별을 그려보세요.</p><button id="next-mission">다른 미션</button><div class="stars"><b>⭐ <span id="star-count">0</span></b><span>완료 스티커</span></div></section><section class="tools"><button id="undo">↶ Undo</button><button id="clear">✦ Clear</button><button id="save">⇩ Save</button><button id="mirror">⇄ Mirror</button><button id="finish" class="finish">미션 완료!</button></section></aside>
  <div class="bottom"><div class="palette"><button class="color rainbow selected" data-color="rainbow" aria-label="무지개"></button><button class="color" data-color="#ffd84d" style="--c:#ffd84d" aria-label="노랑"></button><button class="color" data-color="#ff5c9a" style="--c:#ff5c9a" aria-label="분홍"></button><button class="color" data-color="#55e7ff" style="--c:#55e7ff" aria-label="하늘"></button><button class="color" data-color="#5ee1b2" style="--c:#5ee1b2" aria-label="민트"></button><button class="color" data-color="#ffffff" style="--c:#fff" aria-label="하양"></button><button class="size" data-size="5">S</button><button class="size selected" data-size="10">M</button><button class="size" data-size="18">L</button></div></div>
  <div id="helper" class="helper"><span class="hand">🤏</span><strong>엄지와 검지를 붙여보세요</strong><p>붙이면 그리기 · 떼면 이동</p></div>
  <div id="start" class="start"><div class="start-card"><div class="mascot">🪄🐰</div><h2>손가락이 마법 펜!</h2><p>카메라 앞에서 검지를 움직이고 엄지와 검지를 살짝 붙이면 그림이 그려져요. 모든 처리는 이 브라우저 안에서만 이루어집니다.</p><button id="start-camera">카메라 시작</button><small class="privacy">카메라 권한을 허용해주세요 · 영상은 저장되거나 전송되지 않습니다</small></div></div>
  <div id="toast" class="toast"></div><div id="confetti" class="confetti"></div>

  <script type="module">
    import {HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';
    const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
    const MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),helper=document.querySelector('#helper');
    let landmarker,stream,lastVideoTime=-1,lastDetect=0,strokes=[],current=null,drawing=false,shift=false,sx=null,sy=null,color='rainbow',size=10,hue=45,mirrored=true,stars=0;
    const missions=[['⭐','반짝이는 별','공중에 커다란 별을 그려보세요.'],['🌈','일곱 빛깔 무지개','커다란 무지개를 완성해보세요.'],['🐱','웃는 고양이','귀와 수염이 있는 고양이 얼굴을 그려요.'],['🚀','우주로 가는 로켓','불꽃을 뿜는 로켓을 그려보세요.'],['🌳','마법의 나무','열매가 가득 열린 나무를 그려요.'],['💖','친구에게 하트','소중한 사람을 위한 하트를 그려요.'],['🦕','나만의 공룡','상상 속 공룡을 자유롭게 그려보세요.'],['✍️','내 이름 사인','세상에 하나뿐인 사인을 만들어요.']];let mission=0;
    function fit(){const ratio=devicePixelRatio||1,w=innerWidth,h=innerHeight;if(canvas.width!==w*ratio||canvas.height!==h*ratio){const oldW=canvas.width||w*ratio,oldH=canvas.height||h*ratio;strokes.forEach(s=>s.points.forEach(p=>{p.x*=w*ratio/oldW;p.y*=h*ratio/oldH}));canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(1,0,0,1,0,0)}}addEventListener('resize',fit);
    function penColor(point,index){if(point.color!=='rainbow')return point.color;return`hsl(${(point.hue+index*3)%360} 92% 65%)`}
    function drawStrokes(){ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of strokes){if(stroke.points.length<2)continue;for(let i=1;i<stroke.points.length;i++){ctx.beginPath();ctx.moveTo(stroke.points[i-1].x,stroke.points[i-1].y);ctx.lineTo(stroke.points[i].x,stroke.points[i].y);ctx.strokeStyle=penColor(stroke,i);ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=14;ctx.lineWidth=stroke.width*(devicePixelRatio||1);ctx.stroke()}}ctx.shadowBlur=0}
    function drawHand(lm){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2*(devicePixelRatio||1);const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];for(const[a,b]of links){ctx.beginPath();ctx.moveTo(lm[a].x*canvas.width,lm[a].y*canvas.height);ctx.lineTo(lm[b].x*canvas.width,lm[b].y*canvas.height);ctx.stroke()}}
    function render(result){fit();ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(5,12,25,.68)';ctx.fillRect(0,0,canvas.width,canvas.height);drawStrokes();const lm=result?.landmarks?.[0];if(!lm){drawing=false;current=null;sx=sy=null;status.dataset.state='';status.querySelector('span').textContent='손을 보여주세요';helper.classList.remove('hidden');return}drawHand(lm);const index=lm[8],thumb=lm[4],rx=index.x*canvas.width,ry=index.y*canvas.height;if(sx===null){sx=rx;sy=ry}else{sx+=(rx-sx)*.42;sy+=(ry-sy)*.42}const pinch=Math.hypot(index.x-thumb.x,index.y-thumb.y)<.055,active=pinch||shift;helper.classList.add('hidden');status.dataset.state=active?'draw':'ready';status.querySelector('span').textContent=active?'마법 펜 그리는 중':'손 감지됨 · 손가락을 붙여요';ctx.beginPath();ctx.arc(sx,sy,(active?10:7)*(devicePixelRatio||1),0,Math.PI*2);ctx.fillStyle=active?'#ff5c9a':'#ffffff99';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;if(active){if(!drawing){drawing=true;current={color,width:size,hue,points:[]};strokes.push(current)}current.points.push({x:sx,y:sy});hue=(hue+1.5)%360}else{drawing=false;current=null}}
    async function loop(now){if(video.readyState>=2&&landmarker&&video.currentTime!==lastVideoTime&&now-lastDetect>28){lastVideoTime=video.currentTime;lastDetect=now;try{render(landmarker.detectForVideo(video,now))}catch(error){showToast('손 인식을 다시 준비하고 있어요')}}requestAnimationFrame(loop)}
    async function start(){const button=document.querySelector('#start-camera');button.disabled=true;button.textContent='마법 준비 중…';try{const vision=await FilesetResolver.forVisionTasks(`${CDN}/wasm`);landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();document.querySelector('#start').style.display='none';requestAnimationFrame(loop)}catch(error){button.disabled=false;button.textContent='다시 시도';showToast(location.protocol==='file:'?'localhost로 실행하면 카메라가 더 안정적이에요':'카메라 권한을 확인해주세요');console.error(error)}}
    function showToast(text){const toast=document.querySelector('#toast');toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function updateMission(){const[emoji,title,text]=missions[mission];document.querySelector('#mission-emoji').textContent=emoji;document.querySelector('#mission-title').textContent=title;document.querySelector('#mission-text').textContent=text}
    function celebrate(){stars++;document.querySelector('#star-count').textContent=stars;document.querySelector('#mission-emoji').textContent='🤩';const box=document.querySelector('#confetti'),colors=['#3a86ff','#ff5c9a','#ffd84d','#5ee1b2','#9c72ff'];box.innerHTML=Array.from({length:55},()=>`<i style="--x:${Math.random()*100}%;--r:${Math.random()*180}deg;--c:${colors[Math.floor(Math.random()*colors.length)]}"></i>`).join('');showToast('별 스티커를 받았어요! ⭐');setTimeout(()=>{box.innerHTML='';mission=(mission+1)%missions.length;updateMission()},1450)}
    function save(){const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');if(mirrored){o.translate(out.width,0);o.scale(-1,1)}o.drawImage(canvas,0,0);const link=document.createElement('a');link.download=`magic-drawing-${Date.now()}.png`;link.href=out.toDataURL('image/png');link.click();showToast('그림을 저장했어요!')}
    document.querySelector('#start-camera').onclick=start;document.querySelector('#next-mission').onclick=()=>{mission=(mission+1)%missions.length;updateMission()};document.querySelector('#undo').onclick=()=>{strokes.pop();showToast('마지막 선을 되돌렸어요')};document.querySelector('#clear').onclick=()=>{strokes=[];showToast('새 도화지를 준비했어요')};document.querySelector('#save').onclick=save;document.querySelector('#finish').onclick=celebrate;document.querySelector('#mirror').onclick=()=>{mirrored=!mirrored;canvas.style.transform=mirrored?'scaleX(-1)':'none';showToast(mirrored?'거울 화면':'그대로 보기')};document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=+b.dataset.size;document.querySelectorAll('.size').forEach(x=>x.classList.toggle('selected',x===b))});addEventListener('keydown',e=>{if(e.key==='Shift')shift=true;if(e.code==='Space'){e.preventDefault();strokes=[]}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();strokes.pop()}});addEventListener('keyup',e=>{if(e.key==='Shift')shift=false});addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));updateMission();
  </script>
</body>
</html>
