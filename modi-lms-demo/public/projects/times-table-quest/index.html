<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Times Table Quest</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p>MODI+ NUMBER LAB</p><h1>Times Quest</h1><span>Joystick으로 답을 만들고 Button으로 제출하세요</span></div><b id="mode">연결 중</b></header><section class="toolbar"><div class="mission"><strong>10문제 연속 도전</strong><span>연속 정답일수록 보너스 점수가 커집니다.</span></div><div class="levels"><button data-level="easy">2–5단</button><button data-level="standard" class="active">2–9단</button><button data-level="challenge">6–12단</button></div></section><section class="hud"><div><small>QUESTION</small><b id="question">01 / 10</b></div><div><small>SCORE</small><b id="score">0000</b></div><div><small>STREAK</small><b id="streak">× 0</b></div><div><small>CORRECT</small><b id="correct">0</b></div></section><section id="game" class="game"><div class="problem"><div id="progress" class="progress"></div><div class="equation"><b id="left">7</b><span>×</span><b id="right">8</b></div><div class="answer"><small>YOUR ANSWER</small><strong id="answer">00</strong></div><div id="feedback" class="feedback">답을 만들어보세요</div><div id="confetti" class="confetti"></div></div><aside class="controller"><div class="dial-wrap"><small>DIAL · 빠른 이동</small><div id="dial-visual" class="dial"><b id="dial-number">0</b></div></div><div class="joystick"><button data-action="up">+10</button><button data-action="left">−1</button><i>●</i><button data-action="right">+1</button><button data-action="down">−10</button></div><p>방향을 길게 누르면<br>연속으로 입력됩니다.</p><button id="submit" class="submit">MODI BUTTON · 제출</button></aside><div id="result" class="result" hidden><div><small>QUEST COMPLETE</small><b id="final-score">0</b><p id="final-message">멋진 도전이었어요!</p><button id="again">다시 도전</button></div></div></section><section class="mock"><label>MOCK DIAL<input id="mock-dial" type="range" min="0" max="100" value="0"></label><span id="modules">Joystick · Button 연결 대기</span></section></main><script src="browser-api.js"></script><script src="app.js"></script></body></html>
